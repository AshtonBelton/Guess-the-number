<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gmae">
        <h1>Guess the Number</h1>
        
         <div id="difficulty">
            <button class="difficulty-btn" data-max="50">Easy</button>
            <button class="difficulty-btn active" data-max="100">Medium</button>
            <button class="difficulty-btn" data-max="500">Hard</button>
        </div>

        <p id="range-text"></p>

        <input type="number" id="guess-input" placeholder="Your guess">
        <button id="guess-btn">Guess</button>

        <p id="feedback"></p>
        <p id="attempts">Attempts: 0</p>

        <button id="new-game-btn">New game</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
